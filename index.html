<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4ed" />
    <meta name="description" content="Zhilong Wan is a master's student at Tsinghua University and a member of the EDI Lab, with interests in embodied intelligence, probability, and statistics." />
    <title>Zhilong Wan</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 64px 28px;
        background: #f5f4ed;
        color: #30302c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: min(100%, 700px); }
      h1 {
        margin: 0 0 30px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(36px, 4.8vw, 56px);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.2;
      }
      h1 span { white-space: nowrap; }
      p {
        margin: 0;
        color: #585750;
        font-size: clamp(18px, 1.7vw, 20px);
        letter-spacing: -0.01em;
        line-height: 1.8;
      }
      .welcome {
        margin-top: 28px;
        color: #6b6962;
        font-size: clamp(17px, 1.6vw, 19px);
      }
      ::selection { background: #e8d7c8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hi, I’m <span>Zhilong Wan.</span></h1>
      <p>I’m a master’s student at Tsinghua University and a member of the EDI Lab. My interests include embodied intelligence, probability, and statistics.</p>
      <p class="welcome">Welcome to my little corner of the web. Thanks for stopping by!</p>
    </main>
  </body>
</html>
