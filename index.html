<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="description" content="来自 NICS EFC EDI Lab，研究方向为具身智能。谢谢你来。" />
    <title>个人主页</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f7f2;
        --ink: #242d29;
        --muted: #626c65;
        --green: #355d49;
        --line: #d7dcd2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: #dbe7d7; }
      .page { width: min(100% - 80px, 1080px); margin-inline: auto; }
      .site-header { padding-block: 36px; border-bottom: 1px solid var(--line); }
      .wordmark { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
      main { padding-block: 88px 90px; }
      h1 {
        margin: 0;
        font-size: clamp(36px, 5.7vw, 64px);
        font-weight: 550;
        letter-spacing: -2px;
        line-height: 1.4;
      }
      .intro { margin: 28px 0 0; color: var(--muted); font-size: 20px; line-height: 1.9; }
      .lab-link {
        color: var(--green);
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
        text-decoration-color: #91a995;
      }
      .lab-link:hover { text-decoration-color: currentColor; }
      .lab-link:focus-visible { outline: 2px solid var(--green); outline-offset: 5px; border-radius: 2px; }
      .research { margin-top: 56px; }
      h2 { margin: 0 0 14px; color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: 2px; }
      .research p { margin: 0; font-size: 26px; line-height: 1.6; }
      .site-footer { padding-block: 24px 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; line-height: 1.6; }
      .site-footer p { margin: 0; }
      @media (max-width: 640px) {
        .page { width: calc(100% - 40px); }
        .site-header { padding-block: 25px; }
        main { padding-block: 62px 64px; }
        h1 { font-size: clamp(30px, 8vw, 46px); letter-spacing: -1.2px; }
        .intro { margin-top: 24px; font-size: 18px; }
        .research { margin-top: 44px; }
        .research p { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <span class="wordmark">个人主页</span>
      </header>
      <main aria-labelledby="hello">
        <h1 id="hello">你好，欢迎来访。</h1>
        <p class="intro">我来自 <a class="lab-link" href="https://nicsefc.ee.tsinghua.edu.cn/">NICS EFC EDI Lab</a>。</p>
        <section class="research" aria-labelledby="research-title">
          <h2 id="research-title">研究方向</h2>
          <p>具身智能</p>
        </section>
      </main>
      <footer class="site-footer">
        <p>谢谢你来。</p>
      </footer>
    </div>
  </body>
</html>
