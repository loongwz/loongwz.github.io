<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="description" content="欢迎来到 Zhilong Wan 的空间" />
    <title>Zhilong Wan 的空间</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: #f7f7f2;
        color: #242d29;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: min(100%, 1120px); }
      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(30px, 4.5vw, 60px);
        font-weight: 550;
        letter-spacing: -0.025em;
        line-height: 1.6;
      }
      h1 span { white-space: nowrap; }
      ::selection { background: #dbe7d7; }
    </style>
  </head>
  <body>
    <main>
      <h1>欢迎来到 <span>Zhilong Wan</span> 的空间</h1>
    </main>
  </body>
</html>
