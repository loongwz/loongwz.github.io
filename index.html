<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta name="description" content="loongwz 的个人主页。关于技术、记录，以及日常中的一点探索。" />
    <title>loongwz · 个人主页</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f7f2;
        --ink: #242d29;
        --muted: #626c65;
        --green: #355d49;
        --line: #d7dcd2;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      ::selection { background: #dbe7d7; }

      .page {
        width: min(100% - 80px, 1080px);
        margin-inline: auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-block: 36px;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -.7px;
      }

      .site-label {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 2px;
      }

      .hero { padding-block: 104px 112px; }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 28px;
        color: var(--green);
        font-size: 14px;
        letter-spacing: 1px;
      }

      .eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 5.7vw, 64px);
        font-weight: 550;
        letter-spacing: -2px;
        line-height: 1.4;
      }

      h1 span { white-space: nowrap; }

      .intro {
        max-width: 570px;
        margin: 26px 0 32px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.9;
      }

      .github-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        min-height: 48px;
        padding: 12px 20px;
        border: 1px solid var(--green);
        border-radius: 4px;
        background: var(--green);
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.5;
        text-decoration: none;
      }

      .github-link:hover { background: #264836; }

      .github-link:focus-visible {
        outline: 3px solid var(--green);
        outline-offset: 5px;
      }

      .details {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 88px;
        padding-block: 40px 64px;
        border-top: 1px solid var(--line);
      }

      h2 {
        margin: 0 0 17px;
        color: var(--green);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 2px;
      }

      .about p {
        max-width: 490px;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.95;
      }

      .interests {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 19px;
        line-height: 1.65;
      }

      .interest-note {
        margin: 15px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }

      .site-footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding-block: 23px 30px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 640px) {
        .page { width: calc(100% - 40px); }
        .site-header { padding-block: 25px; }
        .hero { padding-block: 68px 64px; }
        .eyebrow { margin-bottom: 22px; }
        h1 { font-size: clamp(32px, 8vw, 46px); letter-spacing: -1.2px; }
        .intro { margin-top: 23px; font-size: 16px; }
        .details { grid-template-columns: 1fr; gap: 34px; padding-block: 32px 40px; }
        .interests { gap: 12px 28px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <span class="wordmark">loongwz</span>
        <span class="site-label">个人主页</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="hello">
          <p class="eyebrow">欢迎来到我的小小空间</p>
          <h1 id="hello">你好，我是 <span>loongwz。</span></h1>
          <p class="intro">在这里记录想法，尝试新事物。<br />对技术保持好奇，也享受慢慢探索的过程。</p>
          <a class="github-link" href="https://github.com/loongwz">
            看看我的 GitHub <span aria-hidden="true">↗</span>
          </a>
        </section>

        <div class="details">
          <section class="about" aria-labelledby="about-title">
            <h2 id="about-title">关于我</h2>
            <p>喜欢把零散的想法整理成文字，也喜欢从一个小问题开始，摸索新的知识和工具。这个主页是一个简单的起点，想到什么，就慢慢添一点。</p>
          </section>
          <section aria-labelledby="interests-title">
            <h2 id="interests-title">一些兴趣</h2>
            <ul class="interests">
              <li>技术</li>
              <li>记录</li>
              <li>探索</li>
            </ul>
            <p class="interest-note">保持好奇，把日常的小发现留在这里。</p>
          </section>
        </div>
      </main>

      <footer class="site-footer">
        <span>© 2026 loongwz</span>
        <span>谢谢你来。</span>
      </footer>
    </div>
  </body>
</html>
